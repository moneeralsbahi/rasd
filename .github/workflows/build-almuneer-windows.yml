name: Build AlMuneer Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'almuneer-windows-build-source.zip'
      - '.github/workflows/build-almuneer-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ALMUNEER_DEMO_API: https://br-flat-leaf-ax492ag7-almuneergw.compute.c-4.us-east-2.aws.neon.tech

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Smoke test demo backend
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "$env:ALMUNEER_DEMO_API/health" -Method Get -TimeoutSec 60
          if ($health.status -ne 'ok') { throw 'Demo backend health check failed' }
          if ($health.service -ne 'almuneer-demo-api') { throw 'Unexpected demo backend service' }
          $cors = Invoke-WebRequest -Uri "$env:ALMUNEER_DEMO_API/health" -Method Options -Headers @{ Origin='file://'; 'Access-Control-Request-Method'='GET' } -TimeoutSec 60
          if ($cors.StatusCode -lt 200 -or $cors.StatusCode -ge 300) { throw 'CORS preflight returned non-success status' }
          $acao = [string]$cors.Headers['Access-Control-Allow-Origin']
          if ([string]::IsNullOrWhiteSpace($acao)) { throw 'CORS Access-Control-Allow-Origin header missing' }
          $body = @{ identifier='__almuneer_smoke_invalid__'; password='__invalid__' } | ConvertTo-Json -Compress
          try {
            Invoke-WebRequest -Uri "$env:ALMUNEER_DEMO_API/api/v1/auth/admin/login" -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 60 | Out-Null
            throw 'Invalid credentials were unexpectedly accepted'
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 401) { throw "Auth endpoint smoke test expected 401 but received $status" }
          }
          Write-Host "Demo backend PASS: health, CORS, authentication route"

      - name: Extract approved Windows build source
        shell: pwsh
        run: |
          if (!(Test-Path 'almuneer-windows-build-source.zip')) { throw 'almuneer-windows-build-source.zip is missing from repository root' }
          if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }
          New-Item -ItemType Directory -Path 'build' | Out-Null
          Expand-Archive -Path 'almuneer-windows-build-source.zip' -DestinationPath 'build' -Force
          if (!(Test-Path 'build/package.json')) { throw 'Invalid source archive: package.json missing' }

      - name: Harden desktop file protocol paths
        shell: pwsh
        run: |
          $vite = Get-Content 'build/apps/web/vite.config.ts' -Raw
          $vite = $vite.Replace("defineConfig({plugins:[react()]", "defineConfig({base:'./',plugins:[react()]")
          Set-Content 'build/apps/web/vite.config.ts' $vite -NoNewline
          $main = Get-Content 'build/apps/web/src/main.tsx' -Raw
          $main = $main.Replace('src="/logo.png"','src="./logo.png"')
          $main = $main.Replace('href="/student"','href="?portal=student"')
          $old = "if ('serviceWorker' in navigator) window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});`nconst root=document.getElementById('root')!;`ncreateRoot(root).render(<React.StrictMode>{window.location.pathname.startsWith('/student')?<StudentPortal/>:<AdminShell/>}</React.StrictMode>);"
          $new = "if (location.protocol !== 'file:' && 'serviceWorker' in navigator) window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});`nconst root=document.getElementById('root')!;`nconst isStudentPortal=new URLSearchParams(window.location.search).get('portal')==='student'||window.location.pathname.startsWith('/student');`ncreateRoot(root).render(<React.StrictMode>{isStudentPortal?<StudentPortal/>:<AdminShell/>}</React.StrictMode>);"
          if (!$main.Contains($old)) { throw 'Expected desktop routing footer not found' }
          $main = $main.Replace($old,$new)
          Set-Content 'build/apps/web/src/main.tsx' $main -NoNewline

      - name: Pin Electron version for reproducible packaging
        shell: pwsh
        run: |
          $path = 'build/apps/desktop/package.json'
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.devDependencies.electron = '38.0.0'
          $json | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Install dependencies and create lockfile
        working-directory: build
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Build API client
        working-directory: build
        shell: pwsh
        run: npm run build -w @almuneer/api-client

      - name: Build connected Web
        working-directory: build
        shell: pwsh
        env:
          VITE_API_BASE_URL: ${{ env.ALMUNEER_DEMO_API }}
        run: npm run build -w @almuneer/web

      - name: Verify connected Web output
        shell: pwsh
        run: |
          if (!(Test-Path 'build/apps/web/dist/index.html')) { throw 'Web dist/index.html missing' }
          $html = Get-Content 'build/apps/web/dist/index.html' -Raw
          if ($html -match 'src="/assets/' -or $html -match 'href="/assets/') { throw 'Web assets are not file-protocol relative' }
          $js = (Get-ChildItem 'build/apps/web/dist/assets' -Filter '*.js' | Get-Content -Raw) -join "`n"
          if (!$js.Contains('br-flat-leaf-ax492ag7-almuneergw.compute.c-4.us-east-2.aws.neon.tech')) { throw 'Connected API URL missing from Web bundle' }

      - name: Build Windows NSIS installer
        working-directory: build
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win -w @almuneer/desktop -- --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path 'build/apps/desktop/dist' -Filter '*.exe' -Recurse
          if ($files.Count -lt 1) { throw 'Windows installer EXE was not produced' }
          $files | ForEach-Object { Write-Host "Installer: $($_.FullName) Size=$($_.Length)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Almuneer-Windows-Connected-Installer
          path: build/apps/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Almuneer-Windows-Connected-Evidence
          path: |
            build/package-lock.json
            build/apps/web/dist/**
          retention-days: 30
