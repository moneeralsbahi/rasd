name: Export AlMuneer Demo Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-demo-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify published runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s demo-backend/dist/index.js
          node --check demo-backend/dist/index.js
          grep -q 'almuneer-demo-api' demo-backend/dist/index.js
          wc -c demo-backend/dist/index.js
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Almuneer-Demo-Backend-Runtime
          path: demo-backend/dist/index.js
          if-no-files-found: error
          retention-days: 1
