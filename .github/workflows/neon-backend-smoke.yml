name: Neon Backend Acceptance Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-backend-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify connected demo backend
        shell: bash
        run: |
          set -euo pipefail
          API='https://br-flat-leaf-ax492ag7-almuneergw.compute.c-4.us-east-2.aws.neon.tech'
          HEALTH=$(curl --fail --silent --show-error --retry 4 --retry-delay 2 --max-time 30 "$API/health")
          echo "HEALTH=$HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$HEALTH" | grep -q '"demoTenantReady":true'

      - name: Discover server-side demo E2E entrypoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://br-flat-leaf-ax492ag7-demoe2etest.compute.c-4.us-east-2.aws.neon.tech'
          ok=0
          for spec in 'GET /health' 'GET /run' 'GET /test' 'POST /' 'POST /run' 'POST /test'; do
            method=${spec%% *}; path=${spec#* }
            tmp=$(mktemp)
            code=$(curl --silent --show-error --max-time 30 -X "$method" -H 'content-type: application/json' -d '{}' -o "$tmp" -w '%{http_code}' "$BASE$path" || true)
            body=$(cat "$tmp")
            echo "$method $path -> HTTP $code :: $body"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then ok=1; fi
          done
          test "$ok" -eq 1
